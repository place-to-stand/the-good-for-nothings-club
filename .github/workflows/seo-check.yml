# Weekly SEO + agent-readiness regression check against production (see
# scripts/seo-check.mjs, scripts/agent-check.mjs, and SEO-CHANGELOG.md).
# Catches regressions: missing/oversized meta descriptions, missing
# h1/og:image/alt, responses over 500 KB, internal links that 3XX, lost
# markdown negotiation / Vary: Accept, a 404 that stops being a 404, and a
# missing llms.txt or contactPoint.
name: SEO check

on:
  schedule:
    - cron: '0 12 * * 1' # Mondays 12:00 UTC
  workflow_dispatch:

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/seo-check.mjs
      - run: node scripts/agent-check.mjs
        if: always()
